server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# Tails every container's stdout via the Docker socket -- no app code change
# needed since app/core/logger.py only writes to stdout today. Only the
# amrita_icpc_* containers are kept so unrelated container noise doesn't get
# shipped.
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(amrita_icpc_.*)"
        target_label: service_name
        action: keep
        replacement: "$1"
      - source_labels: [__meta_docker_container_name]
        regex: "/(amrita_icpc_.*)"
        target_label: container
        replacement: "$1"
    pipeline_stages:
      # Best-effort: promote trace_id to a label when the app's log line
      # includes it (see app/core/telemetry.py), so a Tempo trace can be
      # linked straight to its log lines in Grafana.
      - regex:
          expression: "trace_id=(?P<trace_id>[0-9a-f]{32})"
      - labels:
          trace_id:
