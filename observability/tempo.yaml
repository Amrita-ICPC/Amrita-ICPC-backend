server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 336h # 14 days

# Requires `tempo -config.expand-env=true` (set in docker-compose command) so
# the ${MINIO_*} values below resolve from the container environment -- reuses
# the same MinIO credentials as the rest of the app instead of a new secret.
storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-traces
      endpoint: minio:9000
      access_key: ${MINIO_ACCESS_KEY}
      secret_key: ${MINIO_SECRET_KEY}
      insecure: true # MINIO_SECURE=false in this deployment; flip if TLS is enabled on MinIO
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Derives RED metrics + a service graph from spans and remote_writes them to
# Prometheus, so trace data shows up as metrics too without app changes.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
