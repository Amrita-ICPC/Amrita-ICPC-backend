global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Started with --web.enable-remote-write-receiver (docker-compose command) so
# Tempo's metrics-generator can remote_write span-derived RED metrics and the
# service graph here without a separate push gateway.

scrape_configs:
  - job_name: amrita-icpc-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]
