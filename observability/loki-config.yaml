auth_enabled: false

server:
  http_listen_port: 3100

# Requires `loki -config.expand-env=true` (set in docker-compose command) so
# the ${MINIO_*} values below resolve from the container environment.
common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    s3:
      endpoint: minio:9000
      bucketnames: loki-logs
      access_key_id: ${MINIO_ACCESS_KEY}
      secret_access_key: ${MINIO_SECRET_KEY}
      insecure: true # MINIO_SECURE=false in this deployment; flip if TLS is enabled on MinIO
      s3forcepathstyle: true
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h # 14 days, enforced by the compactor below
  allow_structured_metadata: true
  # Container/service name -> `service_name` label, so Grafana's Loki
  # datasource can filter logs per process (api, celery_worker_student, ...)
  discover_service_name:
    - container

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3
