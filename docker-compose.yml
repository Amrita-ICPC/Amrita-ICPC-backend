services:
  db:
    image: postgres:15-alpine
    container_name: amrita_icpc_db
    restart: always
    # shared_preload_libraries requires this over just CREATE EXTENSION --
    # the module has to be loaded at server start, not just enabled per-db.
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c pg_stat_statements.max=5000
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-amrita_icpc}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only runs against a fresh (empty) volume -- see the script for the
      # manual command if the db already has data.
      - ./observability/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amrita_icpc_redis
    restart: always
    # Only use password if REDIS_PASSWORD is set.
    # For simplicity in this example, we assume if it's set it's used, but in basic compose
    # it's often easier to omit if null. However, to support the config:
    command: >
      sh -c '
        if [ -n "${REDIS_PASSWORD}" ]; then
          redis-server --requirepass "${REDIS_PASSWORD}";
        else
          redis-server;
        fi
      '
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: amrita_icpc_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: amrita_icpc_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Interactive path: live student submits (SUBMIT) + result persistence (PERSIST).
  celery_worker_student:
    build: .
    container_name: amrita_icpc_celery_worker_student
    restart: always
    command: >
      celery -A app.core.clients.celery:celery_app worker
      -Q student_submit,persist
      --concurrency=${CELERY_STUDENT_CONCURRENCY:-8}
      --loglevel=info
    env_file:
      - .env
    environment:
      OTEL_SERVICE_NAME: worker-student
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Bulk path: instructor "evaluate all" — isolated so it never starves the
  # interactive queue.
  celery_worker_bulk:
    build: .
    container_name: amrita_icpc_celery_worker_bulk
    restart: always
    command: >
      celery -A app.core.clients.celery:celery_app worker
      -Q bulk_contest_evaluation
      --concurrency=${CELERY_BULK_CONCURRENCY:-4}
      --loglevel=info
    env_file:
      - .env
    environment:
      OTEL_SERVICE_NAME: worker-bulk
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Central result poller (one process; batch-collects Judge0 results).
  celery_worker_poller:
    build: .
    container_name: amrita_icpc_celery_worker_poller
    restart: always
    command: >
      celery -A app.core.clients.celery:celery_app worker
      -Q poller
      --concurrency=1
      --loglevel=info
    env_file:
      - .env
    environment:
      OTEL_SERVICE_NAME: worker-poller
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Beat scheduler — drives the poller on its configured cadence.
  celery_beat:
    build: .
    container_name: amrita_icpc_celery_beat
    restart: always
    command: celery -A app.core.clients.celery:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Observability stack (Tempo + Loki + Grafana + OpenTelemetry, plus
  # Postgres/Redis exporters). Started separately via:
  #   docker compose --profile observability up -d
  # Only Grafana publishes a port; everything else (exporters, Prometheus,
  # the Collector, Tempo, Loki, Promtail) stays on the internal compose
  # network so tracing/metrics infra is never exposed directly.
  # ---------------------------------------------------------------------

  # Aggregate, unsampled DB metrics: connections, locks, cache hit ratio,
  # checkpoint/IO activity (built-in collectors), plus the top-cost queries
  # via pg_stat_statements (observability/postgres-exporter-queries.yaml).
  # This is the tool for "what should I optimize" -- unsampled, unlike Tempo.
  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: amrita_icpc_postgres_exporter
    profiles: ["observability"]
    restart: always
    mem_limit: 150m
    environment:
      DATA_SOURCE_NAME: "postgresql://${DATABASE_USERNAME:-postgres}:${DATABASE_PASSWORD:-postgres}@db:5432/${DATABASE_NAME:-amrita_icpc}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./observability/postgres-exporter-queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      db:
        condition: service_healthy

  # Redis keyspace hits/misses (cache hit ratio), key counts per db, memory
  # usage, evictions/expirations, connected clients.
  redis_exporter:
    image: oliver006/redis_exporter:v1.86.0
    container_name: amrita_icpc_redis_exporter
    profiles: ["observability"]
    restart: always
    mem_limit: 100m
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy

  # One-shot: creates the Tempo/Loki buckets on the existing MinIO instance,
  # since (unlike the app's own bucket in app/core/clients/minio.py) neither
  # Tempo nor Loki create their bucket on startup.
  minio_init:
    image: minio/mc:latest
    container_name: amrita_icpc_minio_init
    profiles: ["observability"]
    restart: "no"
    entrypoint: >
      sh -c '
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY:-minioadmin}" "$${MINIO_SECRET_KEY:-minioadmin}" &&
        mc mb -p local/tempo-traces &&
        mc mb -p local/loki-logs
      '
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    container_name: amrita_icpc_otel_collector
    profiles: ["observability"]
    restart: always
    mem_limit: 400m
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - tempo
      - loki

  # Pinned to the last stable 2.x release -- 3.0.0 removed the ingester
  # module entirely (replaced by a new block_builder/live_store
  # architecture), which breaks the classic ingester/compactor config below.
  # `latest` currently resolves to 3.0.2; don't bump this without rewriting
  # tempo.yaml for the new schema first.
  tempo:
    image: grafana/tempo:2.10.7
    container_name: amrita_icpc_tempo
    profiles: ["observability"]
    restart: always
    mem_limit: 500m
    command: ["-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    env_file:
      - .env
    depends_on:
      minio_init:
        condition: service_completed_successfully

  loki:
    image: grafana/loki:3.7.3
    container_name: amrita_icpc_loki
    profiles: ["observability"]
    restart: always
    mem_limit: 500m
    command: ["-config.file=/etc/loki/loki-config.yaml", "-config.expand-env=true"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    env_file:
      - .env
    depends_on:
      minio_init:
        condition: service_completed_successfully

  promtail:
    image: grafana/promtail:3.7.3
    container_name: amrita_icpc_promtail
    profiles: ["observability"]
    restart: always
    mem_limit: 200m
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: amrita_icpc_prometheus
    profiles: ["observability"]
    restart: always
    mem_limit: 500m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # Lets Tempo's metrics-generator remote_write span-derived RED metrics
      # and the service graph here without a separate push gateway.
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:13.1.0
    container_name: amrita_icpc_grafana
    profiles: ["observability"]
    restart: always
    mem_limit: 300m
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Reuses the existing Keycloak realm instead of a separate credential
      # set -- restrict via a "grafana-admin" role/group on this client.
      # Leave GRAFANA_KEYCLOAK_CLIENT_ID unset to fall back to local admin
      # login only (GF_AUTH_DISABLE_LOGIN_FORM stays "false" in that case).
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_KEYCLOAK_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_KEYCLOAK_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'grafana-admin') && 'Admin' || 'Viewer'"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  postgres_data:
  redis_data:
  minio_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
