services:
  db:
    image: postgres:15-alpine
    container_name: amrita_icpc_db
    restart: always
    # shared_preload_libraries requires this over just CREATE EXTENSION --
    # the module has to be loaded at server start, not just enabled per-db.
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c pg_stat_statements.max=5000
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-amrita_icpc}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only runs against a fresh (empty) volume -- see the script for the
      # manual command if the db already has data.
      - ./observability/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amrita_icpc_redis
    restart: always
    # Only use password if REDIS_PASSWORD is set.
    # For simplicity in this example, we assume if it's set it's used, but in basic compose
    # it's often easier to omit if null. However, to support the config:
    command: >
      sh -c '
        if [ -n "${REDIS_PASSWORD}" ]; then
          redis-server --requirepass "${REDIS_PASSWORD}";
        else
          redis-server;
        fi
      '
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: amrita_icpc_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: amrita_icpc_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Interactive path: live student submits (SUBMIT) + result persistence (PERSIST).
  celery_worker_student:
    build: .
    container_name: amrita_icpc_celery_worker_student
    restart: always
    command: >
      celery -A app.core.clients.celery:celery_app worker
      -Q student_submit,persist
      --concurrency=${CELERY_STUDENT_CONCURRENCY:-8}
      --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Bulk path: instructor "evaluate all" — isolated so it never starves the
  # interactive queue.
  celery_worker_bulk:
    build: .
    container_name: amrita_icpc_celery_worker_bulk
    restart: always
    command: >
      celery -A app.core.clients.celery:celery_app worker
      -Q bulk_contest_evaluation
      --concurrency=${CELERY_BULK_CONCURRENCY:-4}
      --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Central result poller (one process; batch-collects Judge0 results).
  celery_worker_poller:
    build: .
    container_name: amrita_icpc_celery_worker_poller
    restart: always
    command: >
      celery -A app.core.clients.celery:celery_app worker
      -Q poller
      --concurrency=1
      --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Beat scheduler — drives the poller on its configured cadence.
  celery_beat:
    build: .
    container_name: amrita_icpc_celery_beat
    restart: always
    command: celery -A app.core.clients.celery:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Load-test monitoring: Postgres query cost + DB health, Redis keys/hit
  # ratio, all viewed in Grafana over Prometheus. No request tracing or
  # worker instrumentation yet (deferred until actually needed). Only
  # Grafana publishes a port; the exporters/Prometheus stay internal-only.
  # ---------------------------------------------------------------------

  # Aggregate, unsampled DB metrics for load testing: connections, locks,
  # cache hit ratio, checkpoint/IO activity (built-in collectors), plus the
  # top-cost queries via pg_stat_statements (observability/postgres-exporter-queries.yaml).
  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: amrita_icpc_postgres_exporter
    profiles: ["observability"]
    restart: always
    mem_limit: 150m
    environment:
      DATA_SOURCE_NAME: "postgresql://${DATABASE_USERNAME:-postgres}:${DATABASE_PASSWORD:-postgres}@db:5432/${DATABASE_NAME:-amrita_icpc}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./observability/postgres-exporter-queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      db:
        condition: service_healthy

  # Redis keyspace hits/misses (cache hit ratio), key counts per db, memory
  # usage, evictions/expirations, connected clients.
  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: amrita_icpc_redis_exporter
    profiles: ["observability"]
    restart: always
    mem_limit: 100m
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: amrita_icpc_prometheus
    profiles: ["observability"]
    restart: always
    mem_limit: 500m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: amrita_icpc_grafana
    profiles: ["observability"]
    restart: always
    mem_limit: 300m
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
