  deploy:
    name: Build & Deploy
    runs-on: [self-hosted, icpc]
    # needs: lint
    # Only deploy when code is pushed to development.
    # We still run the lint job on pull_requests, but skip the deploy step.
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        # Note: `docker build` does not natively support `--env-file`.
        # Env variables required at runtime are handled by docker-compose and the runner.
        run: |
          docker build -t icpc-backend:latest .

      - name: Restart containers
        run: |
          docker compose -f /home/amrita/Amrita-ICPC/backend/docker-compose.yml up -d --force-recreate

      - name: Wait for API container to answer health endpoint
        run: |
          compose_file=/home/amrita/Amrita-ICPC/backend/docker-compose.yml
          container_id="$(docker compose -f "$compose_file" ps -q backend)"

          if [ -z "$container_id" ]; then
            echo "Backend container was not created"
            docker compose -f "$compose_file" ps
            exit 1
          fi

          for i in $(seq 1 30); do
            state="$(docker inspect --format='{{.State.Status}}' "$container_id")"

            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              echo "Backend container state is $state"
              docker compose -f "$compose_file" ps
              docker logs --tail 200 "$container_id"
              exit 1
            fi

            if docker exec "$container_id" python -c "import os, urllib.request; port=os.getenv('API_PORT', '8000'); urllib.request.urlopen(f'http://127.0.0.1:{port}/api/health', timeout=5).read()" > /dev/null 2>&1; then
              echo "Backend API health endpoint is reachable"
              exit 0
            fi

            echo "Attempt $i/30 — backend state is $state; retrying in 5s..."
            sleep 5
          done

          echo "Backend health check timed out"
          docker compose -f "$compose_file" ps
          docker logs --tail 200 "$container_id"
          exit 1

      - name: Show final container state
        run: docker compose -f /home/amrita/Amrita-ICPC/backend/docker-compose.yml ps

      - name: Cleanup old dangling images
        run: docker image prune -f --filter "dangling=true"
