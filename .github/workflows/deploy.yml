#         with:
#           enable-cache: true

#       - name: Install dev dependencies
#         run: uv sync --frozen --dev --no-install-project

#       - name: Run ruff check
#         run: uv run ruff check .

#       - name: Run ruff format check
#         run: uv run ruff format --check .

#       - name: Run mypy
