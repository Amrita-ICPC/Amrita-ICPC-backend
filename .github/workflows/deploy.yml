name: Deploy Backend

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
#   lint:
#     name: Lint & Type Check
#     runs-on: ubuntu-latest

#     steps:
#       - name: Checkout code
#         uses: actions/checkout@v4

#       - name: Setup uv
